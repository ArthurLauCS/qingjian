[package]
name = "qingjian-neural"
description = "字级 Transformer 语言模型的本地推理：加载 tools/lm-train 导出的权重，给整句路径重打分"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Apple Accelerate 的 BLAS（CPU 矩阵乘走 AMX）；缺省是 candle 自带的 gemm
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
# Apple GPU
metal = ["candle-core/metal", "candle-nn/metal"]
# 试验：知意的选词模型（只给 CLI 回放对比用，带上 tokenizers）
zhiyi = ["dep:tokenizers"]

[dependencies]
qingjian-core.workspace = true
qingjian-format.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
